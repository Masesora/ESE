<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1A35"/>
      <stop offset="100%" stop-color="#1a2d5a"/>
    </linearGradient>
    <linearGradient id="sc_gld" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8C96A"/>
      <stop offset="50%" stop-color="#B89D52"/>
      <stop offset="100%" stop-color="#9A7E3A"/>
    </linearGradient>
    <pattern id="grid" x="0" y="0" width="48" height="48" patternUnits="userSpaceOnUse">
      <line x1="0" y1="24" x2="48" y2="24" stroke="#B89D52" stroke-width="0.4" opacity="0.06"/>
      <line x1="24" y1="0" x2="24" y2="48" stroke="#B89D52" stroke-width="0.4" opacity="0.06"/>
    </pattern>
    <linearGradient id="logo_gld" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C8A84B"/>
      <stop offset="50%" stop-color="#E8C96A"/>
      <stop offset="100%" stop-color="#B89D52"/>
    </linearGradient>
  </defs>

  <!-- Fondo -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Franja dorada top -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#sc_gld)"/>

  <!-- Linea acento izquierda -->
  <rect x="80" y="80" width="2" height="470" fill="url(#sc_gld)" opacity="0.35"/>

  <!-- EKG decorativo -->
  <polyline points="860,210 900,210 925,125 950,295 975,210 1000,210 1025,165 1050,255 1075,210 1130,210" fill="none" stroke="url(#sc_gld)" stroke-width="2.5" opacity="0.22" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- LOGO MASFRAME inline (scale 0.56 de 720x160) -->
  <g transform="translate(100,52) scale(0.56)">
    <g transform="translate(28,40)">
      <polygon points="52,0 88,0 106,31 88,62 52,62 34,31" fill="none" stroke="url(#logo_gld)" stroke-width="1.4" opacity="0.9"/>
      <polygon points="54,9 82,9 96,31 82,53 54,53 40,31" fill="none" stroke="url(#logo_gld)" stroke-width="0.5" opacity="0.28"/>
      <text x="70" y="44" font-family="Georgia,serif" font-size="28" font-weight="700" fill="#F9F7F2" text-anchor="middle">M</text>
      <line x1="97" y1="12" x2="118" y2="46" stroke="url(#logo_gld)" stroke-width="1.1" opacity="0.45"/>
      <line x1="104" y1="6" x2="123" y2="38" stroke="url(#logo_gld)" stroke-width="0.5" opacity="0.2"/>
    </g>
    <g transform="translate(164,44)">
      <text x="0" y="52" font-family="Georgia,serif" font-size="46" font-weight="700" fill="#F9F7F2" letter-spacing="4">MASFRAME</text>
      <rect x="0" y="62" width="510" height="1" fill="url(#logo_gld)" opacity="0.55"/>
      <text x="0" y="82" font-family="Georgia,serif" font-size="11" fill="#B89D52" letter-spacing="4.5">SISTEMA CLINICO DE INTERVENCION EMPRESARIAL</text>
    </g>
  </g>

  <!-- Separador bajo logo -->
  <line x1="100" y1="158" x2="700" y2="158" stroke="url(#sc_gld)" stroke-width="1" opacity="0.18"/>

  <!-- Tagline -->
  <text x="100" y="198" font-family="Georgia,serif" font-size="12.5" fill="#B89D52" letter-spacing="5.5" opacity="0.85">MASESORA - LA CLINICA DE EMPRESAS</text>

  <!-- Titular principal -->
  <text x="100" y="318" font-family="Georgia,serif" font-size="76" font-weight="700" fill="#FFFFFF" letter-spacing="-1.5">Escaner de Salud</text>
  <text x="100" y="408" font-family="Georgia,serif" font-size="76" font-weight="700" fill="url(#sc_gld)" letter-spacing="-1.5">Empresarial</text>

  <!-- Subtitulo -->
  <text x="100" y="466" font-family="Georgia,serif" font-size="21" fill="#FFFFFF" opacity="0.52">10 especialidades clinicas - Diagnostico gratuito - Protocolo C0-C6</text>

  <!-- Divisor -->
  <line x1="100" y1="496" x2="420" y2="496" stroke="url(#sc_gld)" stroke-width="1" opacity="0.25"/>

  <!-- Badge -->
  <rect x="100" y="514" width="230" height="34" rx="6" fill="url(#sc_gld)" opacity="0.12"/>
  <rect x="100" y="514" width="230" height="34" rx="6" fill="none" stroke="url(#sc_gld)" stroke-width="1" opacity="0.38"/>
  <text x="215" y="536" font-family="Georgia,serif" font-size="13" font-weight="700" fill="#B89D52" text-anchor="middle" letter-spacing="3.5">MAS@FRAME</text>

  <!-- Acento esquina -->
  <line x1="1090" y1="558" x2="1150" y2="585" stroke="url(#sc_gld)" stroke-width="0.9" opacity="0.22"/>
  <line x1="1100" y1="550" x2="1156" y2="575" stroke="url(#sc_gld)" stroke-width="0.4" opacity="0.12"/>
</svg>
